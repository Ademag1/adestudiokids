<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><script>try{if(localStorage.getItem('ask-read')!=='e09489c4bc587463'){location.replace('../../?next='+encodeURIComponent(location.pathname.split('/').slice(-2,-1)[0]))}}catch(e){location.replace('../../')}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La grande tournée de Mila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital@1&family=Poppins:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
/* Layout: a quiet reading room. Slim header, the book centered and as large as the screen allows, one control row below. */
:root {
  --bg: #F1E8D8;
  --surface: #FBF6EA;
  --fg: #3F342C;
  --muted: #76675B;
  --line: #D9CBB5;
  --accent: #B8604A;
  --accent-fg: #FFFFFF;
  --shadow: rgba(63, 52, 44, 0.30);
  --font-ui: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-note: "Lora", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #231D19; --surface: #2E2722; --fg: #F1E7D6; --muted: #B5A590; --line: #463C34;
    --accent: #E3967F; --accent-fg: #2A1F1A; --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #231D19; --surface: #2E2722; --fg: #F1E7D6; --muted: #B5A590; --line: #463C34;
  --accent: #E3967F; --accent-fg: #2A1F1A; --shadow: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.brand { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; touch-action: pan-y; }
#book { filter: drop-shadow(0 10px 18px var(--shadow)); }
#book img.fb { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 6px; background: var(--surface); }
.bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 500 0.9rem var(--font-ui); min-width: 44px; height: 44px; padding: 0 16px; border-radius: 22px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
select {
  height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 500 0.88rem var(--font-ui); padding: 0 14px; max-width: 46vw;
}
#where { font-size: 0.82rem; color: var(--muted); min-width: 7.5em; text-align: center; font-variant-numeric: tabular-nums; }
.note { text-align: center; font: italic 0.82rem var(--font-note); color: var(--muted); margin: 0; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header>
  <h1>La grande tournée de Mila</h1>
  <span class="brand">AdeStudioKids · Édition française</span>
</header>

<div id="stage"><div id="book" aria-label="Pages du livre"></div></div>

<div class="bar">
  <button class="btn" id="prev" aria-label="Page précédente" type="button">&larr; Retour</button>
  <span id="where" aria-live="polite">Couverture</span>
  <button class="btn primary" id="next" aria-label="Page suivante" type="button">Suivant &rarr;</button>
  <select id="jump" aria-label="Aller à une section">
    <option value="1">Couverture</option>
    <option value="2">Bonjour, petit aide !</option>
    <option value="3">L’histoire commence</option>
    <option value="14">Les lettres perdues</option>
    <option value="16">Dans la forêt</option>
    <option value="21">La dernière lettre</option>
    <option value="23">Réponds à Mila</option>
    <option value="25">Coloriages</option>
    <option value="31">Diplôme d’aide-facteur</option>
    <option value="32">4e de couverture</option>
  </select>
</div>
<p class="note">Glisse ou tire le coin des pages pour tourner. Remplis les activités dans le PDF.</p>

<script>
(function () {
  var TOTAL = 32;
  var urls = [];
  for (var i = 1; i <= TOTAL; i++) urls.push("pages/p" + (i < 10 ? "0" : "") + i + ".jpg");
  var stage = document.getElementById("stage");
  var book = document.getElementById("book");
  var where = document.getElementById("where");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var jump = document.getElementById("jump");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var nav = null;
  var PW = 500;

  function sizeBook() {
    var R = 1.4142;
    var r = stage.getBoundingClientRect();
    var aw = Math.max(220, r.width), ah = Math.max(260, r.height);
    var pw;
    if (aw >= 640 && aw / 2 >= ah / R * 0.75) { pw = Math.min(aw / 2, ah / R); book.style.width = Math.floor(pw * 2) + "px"; }
    else { pw = Math.min(aw, ah / R); book.style.width = Math.floor(pw) + "px"; }
    book.style.height = Math.floor(pw * R) + "px";
    PW = Math.floor(pw);
  }

  function label(idx, orient) {
    if (idx <= 0) return "Couverture";
    if (idx >= TOTAL - 1) return "4e de couverture";
    if (orient === "landscape" && idx < TOTAL - 1) return "Pages " + (idx + 1) + "–" + (idx + 2) + " sur " + TOTAL;
    return "Page " + (idx + 1) + " sur " + TOTAL;
  }

  function refresh() {
    var idx = nav.index(), orient = nav.orientation();
    where.textContent = label(idx, orient);
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= TOTAL - 1;
    try { localStorage.setItem("mila-fr-page", String(idx)); } catch (e) {}
  }

  function startFlip() {
    var pf = new St.PageFlip(book, {
      width: PW, height: Math.floor(PW * 1.4142), size: "fixed",
      minWidth: 220, maxWidth: 1200, minHeight: 311, maxHeight: 1697,
      showCover: true, usePortrait: true, drawShadow: true, maxShadowOpacity: 0.35,
      flippingTime: reduce ? 1 : 750, mobileScrollSupport: false, swipeDistance: 20, startPage: 0
    });
    pf.loadFromImages(urls);
    nav = {
      next: function () { pf.flipNext(); }, prev: function () { pf.flipPrev(); },
      to: function (i) { pf.turnToPage(i); },
      index: function () { return pf.getCurrentPageIndex(); },
      orientation: function () { return pf.getOrientation(); },
      relayout: function () { pf.update(); }
    };
    pf.on("flip", refresh);
    pf.on("changeOrientation", refresh);
    var saved = 0;
    try { saved = parseInt(localStorage.getItem("mila-fr-page") || "0", 10) || 0; } catch (e) {}
    if (saved > 0 && saved < TOTAL) { try { pf.turnToPage(saved); } catch (e) {} }
    refresh();
  }

  function startFallback() {
    var cur = 0, x0 = null;
    var img = document.createElement("img");
    img.className = "fb"; img.alt = "";
    book.appendChild(img);
    function show() { img.src = urls[cur]; img.alt = "Page " + (cur + 1); refresh(); }
    nav = {
      next: function () { if (cur < TOTAL - 1) { cur++; show(); } },
      prev: function () { if (cur > 0) { cur--; show(); } },
      to: function (i) { cur = Math.max(0, Math.min(TOTAL - 1, i)); show(); },
      index: function () { return cur; },
      orientation: function () { return "portrait"; },
      relayout: function () {}
    };
    stage.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (dx < -40) nav.next(); else if (dx > 40) nav.prev();
    });
    var saved = 0;
    try { saved = parseInt(localStorage.getItem("mila-fr-page") || "0", 10) || 0; } catch (e) {}
    cur = saved > 0 && saved < TOTAL ? saved : 0;
    show();
  }

  sizeBook();
  if (window.St && window.St.PageFlip) { try { startFlip(); } catch (e) { book.innerHTML = ""; startFallback(); } }
  else startFallback();

  prevBtn.addEventListener("click", function () { nav.prev(); });
  nextBtn.addEventListener("click", function () { nav.next(); });
  jump.addEventListener("change", function () { nav.to(parseInt(jump.value, 10) - 1); refresh(); });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight") nav.next(); else if (e.key === "ArrowLeft") nav.prev();
  });
  var t = null;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(function () { var old = PW; sizeBook(); if (Math.abs(PW - old) > 40 && window.St && window.St.PageFlip) { location.reload(); return; } nav.relayout(); refresh(); }, 200);
  });
})();
</script>
</html>
